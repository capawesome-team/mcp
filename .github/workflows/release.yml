name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write # Required for npm OIDC trusted publishing and provenance
  issues: write
  pull-requests: write

env:
  NODE_VERSION: 22
  MCP_PUBLISHER_VERSION: 1.8.1

jobs:
  release:
    if: github.repository == 'capawesome-team/mcp'
    runs-on: ubuntu-latest
    steps:
      - name: Create release pull request or GitHub release
        id: release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
      - name: Checkout
        if: ${{ steps.release-please.outputs.release_created }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        if: ${{ steps.release-please.outputs.release_created }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Update npm for OIDC trusted publishing
        if: ${{ steps.release-please.outputs.release_created }}
        run: npm install -g npm@latest
      - name: Install dependencies
        if: ${{ steps.release-please.outputs.release_created }}
        run: npm ci
      - name: Publish to npm
        if: ${{ steps.release-please.outputs.release_created }}
        run: npm publish --provenance
      - name: Download MCP Publisher
        if: ${{ steps.release-please.outputs.release_created }}
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish to MCP Registry
        if: ${{ steps.release-please.outputs.release_created }}
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login dns --domain=capawesome.io --private-key="$MCP_REGISTRY_PRIVATE_KEY"
          for attempt in $(seq 1 5); do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Publish attempt ${attempt} of 5 failed. The new npm version may not be available yet."
            sleep 20
          done
          exit 1
