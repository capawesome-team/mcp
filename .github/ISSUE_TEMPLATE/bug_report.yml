name: 🚨 Bug report
title: "bug: "
description: Create a bug report to help us improve
labels: ["bug/fix", "needs: triage"]

body:
  - type: input
    attributes:
      label: MCP client and version
      description: |
        Which MCP client are you using (e.g. Claude Code, Cursor, VS Code) and which version of this package? Please make sure you are using the latest version before reporting an issue.
      placeholder: Claude Code 2.0.0, @capawesome/mcp 1.0.0
    validations:
      required: true
  - type: input
    attributes:
      label: Tool
      description: The name of the tool that misbehaved, if the issue is specific to one.
      placeholder: search_docs
  - type: textarea
    attributes:
      label: Request
      description: The tool arguments you sent, or the prompt that triggered the request. Never include tokens or other credentials.
      render: json
  - type: textarea
    attributes:
      label: Current behavior
      description: A concise description of what you're experiencing.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Configure the server in ...
        2. Ask the assistant to ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Other information
      description: List any other information that is relevant to your issue. Operating system, Node.js version, etc.
  - type: checkboxes
    attributes:
      label: Before submitting
      description: |
        A well-written bug report allows the maintainers to quickly recreate the necessary conditions to inspect the bug and quickly find its root cause.
        Please ensure your bug report fulfills all of the following requirements.
      options:
        - label: I have read and followed the [bug report guidelines](https://capawesome.io/contributing/bug-reports/).
          required: true
        - label: I have attached links to possibly related issues and discussions.
          required: true
        - label: I have removed all tokens and other credentials from this report.
          required: true
        - label: I understand that incomplete issues (e.g. without reproduction) are closed.
          required: true
